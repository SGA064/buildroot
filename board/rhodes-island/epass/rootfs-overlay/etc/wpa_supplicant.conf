# ePass：不内置任何 network。
#
# 真实凭据在运行时从 rootfs 之外提供，绝不写进镜像，例如：
#   wpa_passphrase "<ssid>" "<psk>" > /tmp/wpa.conf
#   wpa_supplicant -B -D nl80211 -i wlan0 -c /tmp/wpa.conf
#
# 这里保持"无 network"是刻意的：带 key_mgmt=NONE 的模板会让 wpa_supplicant
# 自动关联任意开放 AP。
ctrl_interface=/var/run/wpa_supplicant
ap_scan=1
country=CN
